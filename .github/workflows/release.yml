name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows release
        working-directory: zekrima-windows
        run: cargo build --release
      - name: Package Windows portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path zekrima-windows/target/release/zekrima.exe, zekrima-windows/README.md -DestinationPath zekrima-windows-portable.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            zekrima-windows/target/release/zekrima.exe
            zekrima-windows-portable.zip

  build-arch-linux:
    name: Build Arch Linux / CachyOS Package
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Arch dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git rust cargo pkgconf tar gzip \
            gtk4 gtk4-layer-shell pango cairo gdk-pixbuf2
      - uses: actions/checkout@v4
      - name: Build Linux release
        working-directory: zekrima-arch-linux
        run: cargo build --release
      - name: Package Arch source + PKGBUILD tarball
        run: |
          tar --exclude='zekrima-arch-linux/target' -czf zekrima-arch-cachyos.tar.gz zekrima-arch-linux
      - uses: actions/upload-artifact@v4
        with:
          name: release-arch
          path: zekrima-arch-cachyos.tar.gz

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-arch-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/zekrima.exe
            artifacts/zekrima-windows-portable.zip
            artifacts/zekrima-arch-cachyos.tar.gz
